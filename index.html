 const segs=[...seg('способ',x=>x.m),...seg('сумма',x=>x.s<1e5?'до 100 тыс.':x.s<5e5?'100-500 тыс.':x.s<2e6?'500 тыс.-2 млн':'от 2 млн'),...seg('обеспечение',x=>x.fl==null?null:!x.en?'нет':x.en>=10?'10% и выше':'до 10%'),...seg('СМП',x=>x.fl==null?null:x.sm?'есть преимущество':'нет'),...seg('регион',x=>x.rg)];
 const ins=[];
 if(known.length){ins.push(`Из <b>${known.length}</b> закупок с известным итогом в <b>${pc(nocN,known.length)}%</b> конкуренции не было: заявка одна или ни одной. Там можно выигрывать без демпинга. Итог известен не у всех: протоколы читаются порциями (у остальных ${closed.length-known.length} итог пока не загружен).`)}
 if(drops.length)ins.push(`На состоявшихся торгах цена в среднем падает на <b>${avg(drops).toFixed(1)}%</b> от начальной (медиана ${med(drops).toFixed(1)}%). Закладывайте это в расчёт.`);
 const cn=closed.filter(x=>x.oc=='cancel').length;if(cn)ins.push(`Отменено закупок: <b>${cn}</b> (${pc(cn,closed.length)}%). Отмена - повод следить за повторной закупкой того же заказчика.`);
 T.push({n:7,ds:closed,kind:'p',ph:'Поиск среди завершённых: заказчик, номер, сумма, причина, цена победителя',cls:'ok',q:'Исходы и причины',big:String(closed.length),sub:known.length?('итог известен у '+known.length+', из них '+pc(nocN,known.length)+'% без конкуренции'):'итоги ещё загружаются',mini:ocp.length?donutL(ocp,78):'',
  help:'Чем закончились закупки за период и почему. «Основание признания несостоявшимися» берётся из протокола; снижение цены - разница между начальной ценой и ценой победителя. Таблица срезов показывает, где конкуренция слабее.',
  body:ins.map(t=>`<div class="ins">${t}</div>`).join('')+`<div class="dwrap">${donut(ocp,130)}${legend(ocp)}</div>`+
   (Object.keys(reasons).length?`<h3>Причины, по которым торги не состоялись</h3>`+Object.entries(reasons).sort((a,b)=>b[1].length-a[1].length).map(([k,v],i)=>`<details><summary>${esc(k)} · ${v.length}</summary>${table(v,40)}</details>`).join(''):'')+
   `<details><summary>Срезы: где конкуренция слабее · ${segs.length}</summary>${gtable([['Срез'],['Закрытых','n'],['Без конкуренции, %','n'],['Снижение, %','n']],segs)}</details>`+
   Object.keys(OC).filter(k=>oc[k]).map(k=>`<details><summary>${OC[k]} · ${oc[k]}</summary>${table(closed.filter(x=>(x.oc||'unknown')==k),60)}</details>`).join('')});
 return {T,Q,crit,open,urgent,good,nocN,closed,best}}
function render(){
 applyFilters();const B=build();
 $('grid').innerHTML=B.T.map(t=>`<label for="v${t.n}" class="tile t${t.n} s-${t.cls}"><span class="q">${esc(t.q)}</span><span class="big">${esc(t.big)}<i class="dot"></i></span><span class="mini-w">${t.mini||''}</span><span class="sub">${esc(t.sub)}</span></label>`).join('');
 $('details').innerHTML=B.T.map(t=>`<section class="detail d${t.n}"><label for="v0" class="back">‹ К панели</label><h2>${esc(t.q)}: <span class="s-${t.cls} hl">${esc(t.big)}</span></h2><div class="mut">${esc(t.sub)}</div><div class="help">${esc(t.help)}</div><div class="dsearch"><input type="search" data-n="${t.n}" placeholder="${esc(t.ph||'Поиск внутри')}"><button class="chip" data-act="open" data-n="${t.n}">Развернуть всё</button><button class="chip" data-act="close" data-n="${t.n}">Свернуть всё</button><span class="dcnt mut" id="dc${t.n}"></span></div><div class="sres" id="sr${t.n}" hidden></div><div class="sbody" id="sb${t.n}">${t.body}</div></section>`).join('');TILES=B.T;
 let v;
 if(B.urgent.length)v=`Срочно: ${B.urgent.length} ${plural(B.urgent.length,'закупка закрывает','закупки закрывают','закупок закрывают')} приём за 3 дня - решить, участвуем ли`;
 else if(B.best.length)v=`Срочного нет. Хорошие шансы: ${B.best.length} открытых ${plural(B.best.length,'закупка','закупки','закупок')} из ${B.open.length}`;
 else v=`Срочного нет: ${B.open.length} открытых закупок, явных шансов за период не видно`;
 if(!F.length)v='За выбранный период закупок нет - расширьте фильтры';
 $('verdict').textContent=v;
 $('meta').textContent=`${CFG.subtitle} · в выборке ${F.length} из ${R.length}`+(CFG.stamp?` · проверка сборщика ${CFG.stamp}`:'')+` · панель собрана ${CFG.built}`}
// ---------- панель фильтров ----------
function initFilters(){
 const yrs=[...new Set(R.map(x=>(x.p||x.e||String(x.y||'')).slice(0,4)).filter(Boolean))].sort().reverse();
 const chip=(g,v,l)=>`<button class="chip" data-g="${g}" data-v="${v}">${l}</button>`;
 $('fbar').innerHTML=`<div class="grp"><span class="lab">Год</span>${yrs.map(y=>chip('y',y,y)).join('')}</div>
  <div class="grp"><span class="lab">Квартал</span>${[1,2,3,4].map(q=>chip('q',q,'Кв '+q)).join('')}</div>
  <input type="search" id="q" placeholder="Поиск: предмет, заказчик, №">
  <button class="chip" id="reset">Сбросить</button>`;
 const opts=(k,all)=>`<option value="">${all}</option>`+[...new Set(R.map(x=>x[k]).filter(Boolean))].sort().map(v=>`<option>${esc(v)}</option>`).join('');
 const mons=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
 const DG='<div class="grp" id="dg"><span class="lab">Период с</span><input type="date" id="df"><span class="lab">по</span><input type="date" id="dt"></div>';
 if(matchMedia('(max-width:820px)').matches)$('more2').insertAdjacentHTML('beforeend',DG);else $('fbar').insertAdjacentHTML('beforeend',DG);
 $('more2').insertAdjacentHTML('afterbegin',`<select id="fz"><option value="">44-ФЗ и 223-ФЗ</option><option>44-ФЗ</option><option>223-ФЗ</option></select><select id="rg">${opts('rg','Все регионы')}</select><select id="mm">${opts('m','Любой способ')}</select><select id="stt">${opts('st','Любой статус')}</select><select id="mon"><option value="">Любой месяц</option>${mons.map((m,i)=>`<option value="${String(i+1).padStart(2,'0')}">${m}</option>`).join('')}</select>`);
 $('fbar').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;
  if(b.id=='reset'){ST.years.clear();ST.qs.clear();Object.assign(ST,{from:'',to:'',q:'',fz:'',rg:'',m:'',st:'',mon:''});['df','dt','q'].forEach(i=>$(i).value='');['fz','rg','mm','stt','mon'].forEach(i=>$(i).value='');document.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on'));render();return}
  const set=b.dataset.g=='y'?ST.years:ST.qs,val=b.dataset.g=='y'?b.dataset.v:+b.dataset.v;
  if(set.has(val)){set.delete(val);b.classList.remove('on')}else{set.add(val);b.classList.add('on')}render()});
 const bind=(id,k)=>$(id).addEventListener('input',e=>{ST[k]=e.target.value;render()});
 bind('df','from');bind('dt','to');bind('q','q');bind('fz','fz');bind('rg','rg');bind('mm','m');bind('stt','st');bind('mon','mon')}
document.addEventListener('input',e=>{const el=e.target.closest('.dsearch input');if(!el)return;clearTimeout(el._t);el._t=setTimeout(()=>doSearch(el),160)});
document.addEventListener('click',e=>{const b=e.target.closest('.dsearch button');if(!b)return;const n=b.dataset.n,box=$('sb'+n);const sr=$('sr'+n);const root=sr&&!sr.hidden?sr:box;root.querySelectorAll('details').forEach(d=>d.open=b.dataset.act=='open')});
function doSearch(el){const n=+el.dataset.n,t=TILES.find(x=>x.n==n),q=el.value.trim(),sr=$('sr'+n),sb=$('sb'+n),dc=$('dc'+n);
 if(!q){sr.hidden=true;sr.innerHTML='';sb.hidden=false;dc.textContent='';return}
 sb.hidden=true;sr.hidden=false;
 if(t.kind=='c'){const r=t.ds.filter(c=>matchQ((c.name+' '+(c.rg||'')).toLowerCase(),q));dc.textContent='Найдено заказчиков: '+r.length;sr.innerHTML=r.length?custTable(r,200):'<p class="mut">Ничего не найдено.</p>'}
 else{const r=t.ds.filter(x=>matchX(x,q)).sort((a,b)=>(b.p||b.e||'').localeCompare(a.p||a.e||''));dc.textContent='Найдено закупок: '+r.length+(r.length>200?' (показаны 200)':'');sr.innerHTML=r.length?table(r,200):'<p class="mut">Ничего не найдено. Попробуйте часть слова, номер закупки или сумму цифрами.</p>'}}
initFilters();render();
</script></body></html>
